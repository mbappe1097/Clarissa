<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Homepage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">MyWebsite</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Welcome to My Website</h1>
        <p>A simple homepage built with HTML and CSS</p>
        <button>Learn More</button>
    </section>

    <!-- Content Section -->
    <section class="content">
        <div class="card">
            <h3>Simple</h3>
            <p>Clean structure and easy to understand.</p>
        </div>
        <div class="card">
            <h3>Lightweight</h3>
            <p>No external libraries required.</p>
        </div>
        <div class="card">
            <h3>Responsive</h3>
            <p>Looks great on all screen sizes.</p>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 MyWebsite. All rights reserved.</p>
    </footer>

</body>
</html>
